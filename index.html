<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AutoStore Viktregister</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f4f4f4;
    padding:20px;
    max-width:1400px;
    margin:auto;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
    margin-bottom:20px;
    box-shadow:0 2px 6px rgba(0,0,0,.15);
}

h2{
    margin-top:0;
}

label{
    display:block;
    font-weight:bold;
    margin-top:10px;
}

input{
    width:100%;
    padding:10px;
    margin-top:5px;
    box-sizing:border-box;
}

button{
    background:#0066cc;
    color:white;
    border:none;
    padding:10px 15px;
    border-radius:5px;
    margin-top:10px;
    cursor:pointer;
}

button:hover{
    background:#004d99;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#0066cc;
    color:white;
}

th,td{
    border:1px solid #ddd;
    padding:8px;
    text-align:left;
}

.result{
    font-size:40px;
    text-align:center;
    color:green;
    font-weight:bold;
    margin-top:20px;
    background:#eef9ee;
    padding:20px;
    border-radius:10px;
}

.small{
    font-size:12px;
}

.green{
    color:green;
    font-weight:bold;
}

.yellow{
    color:orange;
    font-weight:bold;
}

.red{
    color:red;
    font-weight:bold;
}
    .header-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
}

.header-buttons{
    display:flex;
    gap:10px;
}

.button-green{
    background:#28a745;
}

.button-green:hover{
    background:#218838;
}

.button-orange{
    background:#ff9800;
}

.button-orange:hover{
    background:#e68900;
}

</style>
</head>

<body>

<!-- PLOCKBERÄKNING -->

<div class="card">

<div class="header-row">

<h2>Plockberäkning</h2>

<div class="header-buttons">

<button
class="button-green"
onclick="nyArtikel()">
Lägg till ny artikel
</button>

<button
class="button-orange"
onclick="sendToScale()">
Send to Scale
</button>

</div>

</div>

<label>Artikelnummer</label>
<input type="text" id="plockArtikel">

<label>Antal att plocka</label>
<input type="number" id="plockAntal">

<button onclick="beraknaPlock()">
Beräkna målvikt
</button>

<div id="resultat" class="result">

Ingen beräkning gjord

</div>

</div>

<div class="card">

<h2>Sök</h2>

<input
type="text"
id="sok"
placeholder="Sök artikelnummer eller beskrivning"
onkeyup="visaRegister()">

</div>

<!-- ARTIKELREGISTER -->

<div class="card">

<h2>Artikelregister</h2>

<table>

<thead>

<tr>

<th>Artikel</th>
<th>Beskrivning</th>
<th>Styckvikt</th>
<th>Senast verifierad</th>
<th>Status</th>
<th>Historik</th>
<th>Radera</th>

</tr>

</thead>

<tbody id="tabell"></tbody>

</table>

</div>

<!-- REGISTRERA -->

<div class="card">

<h2>Registrera / Uppdatera artikel</h2>

<label>Artikelnummer</label>
<input type="text" id="artikel">

<label>Beskrivning</label>
<input type="text" id="beskrivning">

<label>Referensantal</label>
<input type="number" id="antal" value="200">

<label>Total vikt (gram)</label>
<input type="number" step="0.000001" id="vikt">

<button onclick="sparaArtikel()">

Spara artikel

</button>

<button onclick="uppdateraVikt()">

Uppdatera vikt

</button>

<p id="info"></p>

</div>

<!-- IMPORT EXPORT -->

<div class="card">

<h2>Import / Export</h2>

<input type="file" id="excelFile">

<br><br>

<button onclick="importExcel()">

Importera Excel

</button>

<button onclick="exportExcel()">

Exportera Excel

</button>

</div>

<script>

let register = {};

async function sparaData(){

}


function idag(){

    return new Date()
    .toISOString()
    .split("T")[0];

}

function statusText(datum){

    let dagar =
    Math.floor(
    (new Date()-new Date(datum))
    /(1000*60*60*24)
    );

    if(dagar < 365)
        return '<span class="green">🟢 OK</span>';

    if(dagar < 730)
        return '<span class="yellow">🟡 Kontrollera</span>';

    return '<span class="red">🔴 För gammal</span>';

}

async function sparaArtikel(){


    let artikel =
    document.getElementById("artikel").value.trim();

    let beskrivning =
    document.getElementById("beskrivning").value.trim();

    let antal =
    Number(document.getElementById("antal").value);

    let vikt =
    Number(document.getElementById("vikt").value);

    if(!artikel || antal <=0 || vikt <=0){

        alert("Fyll i alla fält");
        return;

    }

    const styckvikt =
    vikt / antal;

    register[artikel] = {

        beskrivning: beskrivning,

        styckvikt: styckvikt,

        verifierad: idag(),

        historik: [

            {
                datum:idag(),
                styckvikt:styckvikt
            }

        ]

    };

await fetch(
    "https://vikt-api.mr-magoo21.workers.dev/spara",
    {
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({
            artikelnummer:artikel,
            beskrivning:beskrivning,
            styckvikt:styckvikt,
            verifierad:idag()
        })
    }
);

await hamtaArtiklar();

    document.getElementById("info").innerHTML =
    "Artikel sparad. Styckvikt: " +
    styckvikt.toFixed(6) +
    " g";

}

function uppdateraVikt(){

    let artikel =
    document.getElementById("artikel").value.trim();

    if(!register[artikel]){

        alert("Artikeln finns inte");

        return;

    }

    let antal =
    Number(document.getElementById("antal").value);

    let vikt =
    Number(document.getElementById("vikt").value);

    let styckvikt =
    vikt / antal;

    register[artikel].styckvikt =
    styckvikt;

    register[artikel].verifierad =
    idag();

    register[artikel].historik.push({

        datum:idag(),
        styckvikt:styckvikt

    });

    sparaData();

    visaRegister();

    document.getElementById("info").innerHTML =
    "Vikten uppdaterad";

}

function beraknaPlock(){

    let artikel =
    document.getElementById("plockArtikel").value.trim();

    let antal =
    Number(document.getElementById("plockAntal").value);

    if(!register[artikel]){

        alert("Artikel saknas");

        return;

    }

    let styckvikt =
    register[artikel].styckvikt;

    let totalvikt =
    styckvikt * antal;

    document.getElementById("resultat").innerHTML =

    `
    ${totalvikt.toFixed(3)} g
    <br>
    <span style="font-size:16px">
    Styckvikt:
    ${styckvikt.toFixed(6)} g
    </span>
    `;

}

function visaRegister(){

    let filter =
    document.getElementById("sok")
    .value
    .toLowerCase();

    let html = "";

    Object.entries(register)

    .forEach(([artikel,data]) => {

    let text =
    (artikel + " " +
     data.beskrivning)
     .toLowerCase();

    if(!text.includes(filter))
        return;

    let historik =
    data.historik
    .map(x =>

        x.datum +
        " : " +
        x.styckvikt.toFixed(6)

    )

    .join("<br>");

    html +=

    `
    <tr>

        <td>${artikel}</td>

        <td>${data.beskrivning}</td>

        <td>
        ${data.styckvikt.toFixed(6)}
        </td>

        <td>
        ${data.verifierad}
        </td>

        <td>
        ${statusText(data.verifierad)}
        </td>

        <td class="small">
        ${historik}
        </td>

        <td>

        <button onclick="raderaArtikel('${artikel}')">

        Radera

        </button>

        </td>

    </tr>
    `;

    });

    document.getElementById("tabell").innerHTML =
    html;

}

function raderaArtikel(artikel){

    if(confirm("Radera artikel?")){

        delete register[artikel];

        sparaData();

        visaRegister();

    }

}

function exportExcel(){

    let data = [];

    Object.entries(register)

    .forEach(([artikel,obj]) => {

        data.push({

        Artikel:artikel,
        Beskrivning:obj.beskrivning,
        Styckvikt:obj.styckvikt,
        SenastVerifierad:obj.verifierad

        });

    });

    let ws =
    XLSX.utils.json_to_sheet(data);

    let wb =
    XLSX.utils.book_new();

    XLSX.utils.book_append_sheet(

        wb,
        ws,
        "Viktregister"

    );

    XLSX.writeFile(

        wb,
        "Viktregister.xlsx"

    );

}

function importExcel(){

    let file =
    document.getElementById("excelFile")
    .files[0];

    if(!file){

        alert("Välj fil");

        return;

    }

    let reader =
    new FileReader();

    reader.onload = function(e){

        let data =
        new Uint8Array(e.target.result);

        let wb =
        XLSX.read(data,{type:"array"});

        let ws =
        wb.Sheets[
        wb.SheetNames[0]
        ];

        let rows =
        XLSX.utils.sheet_to_json(ws);

        rows.forEach(r => {

            if(!r.Artikel)
                return;

            register[r.Artikel] = {

                beskrivning:
                r.Beskrivning || "",

                styckvikt:
                Number(r.Styckvikt || 0),

                verifierad:
                r.SenastVerifierad || idag(),

                historik:[{
                    datum:
                    r.SenastVerifierad || idag(),

                    styckvikt:
                    Number(r.Styckvikt || 0)
                }]
            };

        });

        sparaData();

        visaRegister();

        alert("Import klar");

    };

    reader.readAsArrayBuffer(file);

}
    async function hamtaArtiklar(){

    const response = await fetch(
        "https://vikt-api.mr-magoo21.workers.dev/artiklar"
    );

    const artiklar = await response.json();

    register = {};

    artiklar.forEach(a => {

        register[a.artikelnummer] = {

            beskrivning: a.beskrivning || "",
            styckvikt: Number(a.styckvikt),
            verifierad: a.verifierad,
            historik: []

        };

    });

    visaRegister();
}
function nyArtikel(){

    document
    .getElementById("artikel")
    .scrollIntoView({
        behavior:"smooth"
    });

    document
    .getElementById("artikel")
    .focus();
}

function sendToScale(){

    let artikel =
    document
    .getElementById("plockArtikel")
    .value
    .trim();

    let antal =
    Number(
        document
        .getElementById("plockAntal")
        .value
    );

    if(!register[artikel]){

        alert("Artikel saknas");

        return;
    }

    let styckvikt =
    register[artikel].styckvikt;

    let malvikt =
    styckvikt * antal;

    alert(
        "Send To Scale\n\n" +
        "Artikel: " + artikel + "\n" +
        "Antal: " + antal + "\n" +
        "Målvikt: " +
        malvikt.toFixed(3) +
        " g"
    );
}
hamtaArtiklar();

</script>

</body>
</html>
